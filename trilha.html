<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha | Hara Spa</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c1a17">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/sidebar/sidebar.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/tracker.js"></script>
<script src="assets/sidebar/sidebar.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f5f7fb;color:#111827;}
.app{display:flex;min-height:100vh;}
#sidebar{width:260px;flex-shrink:0;}
.content{flex:1;padding:40px;max-width:1100px;}
h1{margin:0 0 6px;font-size:26px;}
.sub{color:#6b7280;font-size:14px;margin:0 0 22px;line-height:1.5}

/* resumo */
.resumo{background:#1c1a17;color:#efe7da;border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:20px;margin-bottom:22px;box-shadow:0 6px 20px rgba(28,26,23,.18)}
.anel{--p:0;width:74px;height:74px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(#c9a55c calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
.anel span{width:58px;height:58px;border-radius:50%;background:#1c1a17;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff}
.resumo b{font-size:18px;color:#fff;display:block;margin-bottom:3px}
.resumo small{font-size:13px;color:#cfc6b6;line-height:1.45;display:block}

/* módulos */
.lista{display:flex;flex-direction:column;gap:12px}
.mod{background:#fff;border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.mod:hover{border-color:#e7d7b4;transform:translateY(-1px)}
.mod .num{width:42px;height:42px;border-radius:12px;background:#f5efe3;color:#a07d3b;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.mod.ok .num{background:#dcfce7;color:#16a34a}
.mod .info{flex:1;min-width:0}
.mod .tt{font-weight:700;font-size:15px;margin-bottom:3px}
.mod .ds{font-size:13px;color:#6b7280;line-height:1.4}
.mod .meta{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:#dcfce7;color:#15803d}
.pill.meio{background:#fef3c7;color:#b45309}
.pill.novo{background:#eef2ff;color:#4338ca}
.pill.atual{background:#ffedd5;color:#c2410c}
.dur{font-size:12px;color:#9ca3af}
.mod .ir{color:#c9a55c;font-size:18px;flex-shrink:0}

/* módulo aberto */
#vModulo{display:none}
.voltar{background:none;border:none;color:#6b7280;font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:10px;display:inline-flex;gap:8px;align-items:center}
.voltar:hover{color:#111827}
.player{background:#000;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.player video{display:block;width:100%;max-height:70vh;background:#000}
.trava{margin-top:16px;background:#fff;border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.trava i{font-size:22px;color:#c9a55c}
.trava .tx{flex:1;font-size:14px;color:#374151;line-height:1.45}
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn-ouro{background:#c9a55c;color:#1c1a17}
.btn-ouro:hover{background:#d4b26c}
.btn-ouro:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.btn-esc{background:#1f2937;color:#fff}
.btn-claro{background:#fff;color:#374151;border:1.5px solid #d1d5db}

/* teste */
#teste{display:none;margin-top:18px}
.perg{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.perg .en{font-weight:700;font-size:15px;margin-bottom:12px;line-height:1.45}
.perg .en span{color:#c9a55c;margin-right:6px}
.opc{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.4;transition:border-color .12s,background .12s}
.opc:hover{border-color:#e7d7b4}
.opc input{margin-top:2px;accent-color:#a07d3b;flex-shrink:0}
.opc.sel{border-color:#c9a55c;background:#fffbf2}
.opc.certa{border-color:#16a34a;background:#f0fdf4}
.opc.errada{border-color:#dc2626;background:#fef2f2}
.expl{margin-top:8px;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:9px}
.expl.ok{background:#f0fdf4;color:#166534}
.expl.nao{background:#fef2f2;color:#991b1b}
.resultado{border-radius:14px;padding:18px 20px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.resultado.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.resultado.nao{background:#fffbeb;border:1px solid #fcd34d;color:#78350f}
.resultado i{font-size:28px}
.resultado b{display:block;font-size:17px;margin-bottom:2px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.vazio{background:#fff;border-radius:14px;padding:30px;text-align:center;color:#6b7280}

@media (max-width:768px){
  html,body{overflow-x:hidden}
  #sidebar{width:auto}
  .content{padding:16px 16px 90px;max-width:100vw}
  h1{font-size:21px}
  .resumo{padding:16px;gap:14px}
  .anel{width:62px;height:62px}.anel span{width:48px;height:48px;font-size:15px}
  .mod{padding:14px;gap:12px}
  .player{border-radius:10px;margin:0 -4px}
  .trava{flex-direction:column;align-items:stretch;text-align:left}
  .btn{width:100%;padding:13px}
  .acoes .btn{flex:1}
  .opc{font-size:15px;padding:13px}
}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar"></aside>
<main class="content">

<div id="vLista">
  <h1>Trilha de treinamento</h1>
  <p class="sub">Vídeos curtos mostrando como usar o sistema no dia a dia. Assista e responda o teste para concluir cada módulo.</p>
  <div class="resumo">
    <div class="anel" id="anel"><span id="anelTx">0%</span></div>
    <div><b id="resTit">Carregando…</b><small id="resSub"></small></div>
  </div>
  <div class="lista" id="lista"></div>
</div>

<div id="vModulo">
  <button class="voltar" onclick="voltarLista()"><i class="fa fa-arrow-left"></i> Voltar para a trilha</button>
  <h1 id="mTit"></h1>
  <p class="sub" id="mDesc"></p>
  <div class="player"><video id="video" controls playsinline preload="metadata"></video></div>
  <div class="trava" id="trava">
    <i class="fa fa-lock" id="travaIc"></i>
    <div class="tx" id="travaTx"></div>
    <button class="btn btn-ouro" id="btnTeste" onclick="abrirTeste()" disabled><i class="fa fa-pen-to-square"></i> Fazer o teste</button>
  </div>
  <div id="teste"></div>
</div>

</main>
</div>

<script>
let modulos = [], atual = null, perguntas = [];
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataBR = ts => { try { return new Date(ts).toLocaleDateString("pt-BR"); } catch(_) { return ""; } };
const minutos = s => s ? (s < 60 ? s + " s" : Math.round(s / 60) + " min") : "";
function getUser(cb, n = 40){ if(window.usuarioLogado) return cb(window.usuarioLogado); if(n <= 0) return cb(null); setTimeout(() => getUser(cb, n - 1), 100); }

async function carregar(){
  const { data, error } = await client.rpc("trilha_meus_modulos");
  if(error){ $("lista").innerHTML = `<div class="vazio">Não foi possível carregar a trilha.<br><small>${esc(error.message)}</small></div>`; return; }
  modulos = data || [];
  renderLista();
  // abre direto pelo link: trilha.html?m=slug
  const m = new URLSearchParams(location.search).get("m");
  if(m && !atual){ const x = modulos.find(y => y.slug === m); if(x) abrirModulo(x.id); }
}

function statusPill(m){
  if(m.concluido) return `<span class="pill ok"><i class="fa fa-check"></i> Concluído em ${dataBR(m.concluido_em)}</span>`;
  if(m.atualizado) return `<span class="pill atual"><i class="fa fa-rotate"></i> Atualizado — assista de novo</span>`;
  if(m.assistiu) return `<span class="pill meio"><i class="fa fa-pen-to-square"></i> Falta o teste</span>`;
  return `<span class="pill novo"><i class="fa fa-play"></i> Novo</span>`;
}

function renderLista(){
  const tot = modulos.length, ok = modulos.filter(m => m.concluido).length;
  const p = tot ? Math.round(ok * 100 / tot) : 0;
  $("anel").style.setProperty("--p", p); $("anelTx").textContent = p + "%";
  $("resTit").textContent = tot ? (ok === tot ? "Trilha concluída! 🎉" : `${ok} de ${tot} módulos concluídos`) : "Nenhum módulo por enquanto";
  $("resSub").textContent = tot ? (ok === tot ? "Quando um vídeo novo entrar ou algum fluxo mudar, ele aparece aqui." : "Recomendado para toda a equipe. Cada módulo leva poucos minutos.") : "";
  $("lista").innerHTML = tot ? modulos.map((m, i) => `
    <div class="mod ${m.concluido ? "ok" : ""}" onclick="abrirModulo('${m.id}')">
      <div class="num">${m.concluido ? '<i class="fa fa-check"></i>' : i + 1}</div>
      <div class="info">
        <div class="tt">${esc(m.titulo)}</div>
        <div class="ds">${esc(m.descricao || "")}</div>
        <div class="meta">${statusPill(m)}<span class="dur"><i class="fa fa-clock"></i> ${minutos(m.duracao_seg)} · ${m.n_perguntas} perguntas</span></div>
      </div>
      <i class="fa fa-chevron-right ir"></i>
    </div>`).join("") : `<div class="vazio"><i class="fa fa-graduation-cap" style="font-size:26px;color:#c9a55c"></i><br><br>Os vídeos da trilha vão aparecer aqui.</div>`;
}

function voltarLista(){
  const v = $("video"); v.pause();
  atual = null; $("vModulo").style.display = "none"; $("vLista").style.display = "block";
  history.replaceState(null, "", location.pathname);
  carregar(); window.scrollTo(0, 0);
}

function atualizarTrava(){
  const m = atual, b = $("btnTeste");
  if(m.concluido){
    $("travaIc").className = "fa fa-circle-check"; $("travaIc").style.color = "#16a34a";
    $("travaTx").innerHTML = `<b>Módulo concluído em ${dataBR(m.concluido_em)}.</b> Pode rever o vídeo ou refazer o teste quando quiser.`;
    b.disabled = false; b.innerHTML = '<i class="fa fa-rotate"></i> Refazer o teste';
  } else if(m.assistiu){
    $("travaIc").className = "fa fa-lock-open"; $("travaIc").style.color = "#c9a55c";
    $("travaTx").innerHTML = "<b>Teste liberado.</b> São " + m.n_perguntas + " perguntas rápidas sobre o vídeo.";
    b.disabled = false; b.innerHTML = '<i class="fa fa-pen-to-square"></i> Fazer o teste';
  } else {
    $("travaIc").className = "fa fa-lock"; $("travaIc").style.color = "#c9a55c";
    $("travaTx").innerHTML = "Assista ao vídeo até o fim para liberar o teste.";
    b.disabled = true; b.innerHTML = '<i class="fa fa-pen-to-square"></i> Fazer o teste';
  }
}

function abrirModulo(id){
  atual = modulos.find(m => m.id === id); if(!atual) return;
  $("vLista").style.display = "none"; $("vModulo").style.display = "block";
  $("mTit").textContent = atual.titulo; $("mDesc").textContent = atual.descricao || "";
  $("teste").style.display = "none"; $("teste").innerHTML = "";
  const v = $("video");
  if(v.getAttribute("src") !== atual.video_url){ v.src = atual.video_url; v.load(); }
  atualizarTrava();
  history.replaceState(null, "", location.pathname + "?m=" + encodeURIComponent(atual.slug));
  window.scrollTo(0, 0);
}

// terminou o vídeo → libera o teste (fica gravado no banco)
let marcando = false;
async function marcarAssistido(){
  if(!atual || atual.assistiu || marcando) return;
  marcando = true;
  const { error } = await client.rpc("trilha_assistiu", { p_modulo: atual.id });
  marcando = false;
  if(error){ console.warn(error); return; }
  atual.assistiu = true; atualizarTrava();
  $("trava").animate([{ transform: "scale(1)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 500 });
}
$("video").addEventListener("ended", marcarAssistido);
$("video").addEventListener("error", () => {
  if(!atual) return;
  $("travaIc").className = "fa fa-triangle-exclamation"; $("travaIc").style.color = "#dc2626";
  $("travaTx").innerHTML = "<b>Não foi possível carregar o vídeo.</b> Avise o administrador (arquivo: " + esc(atual.video_url) + ").";
});
$("video").addEventListener("timeupdate", e => { const v = e.target; if(v.duration && v.currentTime >= v.duration - 1.5) marcarAssistido(); });

async function abrirTeste(){
  const b = $("btnTeste"); b.disabled = true;
  const { data, error } = await client.rpc("trilha_perguntas", { p_modulo: atual.id });
  b.disabled = false;
  if(error){ alert("Não foi possível abrir o teste: " + error.message); return; }
  perguntas = data || [];
  renderTeste();
  $("teste").style.display = "block";
  $("teste").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderTeste(resultado){
  const r = resultado ? Object.fromEntries((resultado.itens || []).map(i => [i.id, i])) : null;
  let h = "";
  if(resultado){
    h += resultado.aprovado
      ? `<div class="resultado ok"><i class="fa fa-circle-check"></i><div><b>Parabéns! Módulo concluído.</b>Você acertou ${resultado.acertos} de ${resultado.total}.</div></div>`
      : `<div class="resultado nao"><i class="fa fa-circle-info"></i><div><b>Quase lá! ${resultado.acertos} de ${resultado.total}.</b>Veja as explicações abaixo e tente de novo. Pode rever o vídeo se quiser.</div></div>`;
  }
  h += perguntas.map((q, i) => {
    const it = r && r[q.id];
    const ops = (q.opcoes || []).map((o, j) => {
      let cls = "";
      if(it){ if(j === it.correta) cls = "certa"; else if(String(j) === String(respostas[q.id])) cls = "errada"; }
      else if(String(j) === String(respostas[q.id])) cls = "sel";
      return `<label class="opc ${cls}"><input type="radio" name="q${i}" value="${j}" ${String(j) === String(respostas[q.id]) ? "checked" : ""} ${it ? "disabled" : ""}
        onchange="marcar('${q.id}',${j})"> <span>${esc(o)}</span></label>`;
    }).join("");
    const ex = it && it.explicacao ? `<div class="expl ${it.ok ? "ok" : "nao"}">${it.ok ? "✓ " : ""}${esc(it.explicacao)}</div>` : "";
    return `<div class="perg"><div class="en"><span>${i + 1}.</span>${esc(q.enunciado)}</div>${ops}${ex}</div>`;
  }).join("");
  if(!resultado){
    h += `<div class="acoes"><button class="btn btn-ouro" id="btnEnviar" onclick="enviar()"><i class="fa fa-paper-plane"></i> Enviar respostas</button></div>`;
  } else if(resultado.aprovado){
    const prox = modulos.find(m => !m.concluido && m.id !== atual.id);
    h += `<div class="acoes">${prox ? `<button class="btn btn-ouro" onclick="abrirModulo('${prox.id}')"><i class="fa fa-forward"></i> Próximo módulo</button>` : ""}
      <button class="btn btn-claro" onclick="voltarLista()"><i class="fa fa-list"></i> Voltar para a trilha</button></div>`;
  } else {
    h += `<div class="acoes"><button class="btn btn-ouro" onclick="tentarDeNovo()"><i class="fa fa-rotate"></i> Tentar de novo</button>
      <button class="btn btn-claro" onclick="reverVideo()"><i class="fa fa-play"></i> Rever o vídeo</button></div>`;
  }
  $("teste").innerHTML = h;
}

let respostas = {};
function marcar(id, j){ respostas[id] = j; document.querySelectorAll(`input[onchange*="${id}"]`).forEach(inp => inp.closest(".opc").classList.toggle("sel", inp.checked)); }
function tentarDeNovo(){ respostas = {}; renderTeste(); $("teste").scrollIntoView({ behavior: "smooth", block: "start" }); }
function reverVideo(){ window.scrollTo({ top: 0, behavior: "smooth" }); const v = $("video"); v.currentTime = 0; v.play().catch(() => {}); }

async function enviar(){
  const faltam = perguntas.filter(q => respostas[q.id] === undefined).length;
  if(faltam){ alert(faltam === 1 ? "Falta responder 1 pergunta." : `Faltam responder ${faltam} perguntas.`); return; }
  const b = $("btnEnviar"); b.disabled = true; b.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Corrigindo…';
  const { data, error } = await client.rpc("trilha_responder", { p_modulo: atual.id, p_respostas: respostas });
  if(error){ alert(error.message); b.disabled = false; b.innerHTML = '<i class="fa fa-paper-plane"></i> Enviar respostas'; return; }
  if(data.aprovado){ atual.concluido = true; atual.concluido_em = new Date().toISOString(); atualizarTrava(); if(window.atualizarSeloTrilha) window.atualizarSeloTrilha(); }
  renderTeste(data);
  $("teste").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ao abrir outro módulo, começa o teste do zero
const _abrir = abrirModulo;
abrirModulo = function(id){ respostas = {}; _abrir(id); };

document.addEventListener("DOMContentLoaded", () => getUser(() => carregar()));
</script>
</body>
</html>
