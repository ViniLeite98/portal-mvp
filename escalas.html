<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escalas | Hara Spa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/sidebar/sidebar.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f5f7fb;}
.app{display:flex;min-height:100vh;}
#sidebar{width:260px;flex-shrink:0;}
.content{flex:1;padding:40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.topbar h1{margin:0;}
.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.mes-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.mes-nav h3{margin:0;font-size:16px;font-weight:700;color:#111827;}
.mes-nav button{background:#f3f4f6;color:#374151;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;}
.mes-nav button:hover{background:#e5e7eb;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.weekdays div{text-align:center;font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;padding:4px 0;}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{border:2px solid #e5e7eb;border-radius:10px;padding:8px 6px;cursor:pointer;min-height:72px;transition:all .15s;position:relative;}
.day:hover{border-color:#6b7280;transform:translateY(-1px);}
.day.selected{border-color:#2563eb!important;box-shadow:0 0 0 3px rgba(37,99,235,.15);}
.day-number{font-weight:700;font-size:13px;color:#111827;}
.day small{font-size:10px;color:#6b7280;display:block;margin-top:4px;}
.day-fechado{background:#f9fafb;border-color:#e5e7eb!important;cursor:default;opacity:.6;}
.day-fechado:hover{transform:none;}
.day-fechado .day-number{color:#9ca3af;}
.day-verde{background:#f0fdf4;border-color:#22c55e;}
.day-amarelo{background:#fefce8;border-color:#eab308;}
.day-vermelho{background:#fef2f2;border-color:#ef4444;}
.day-hoje .day-number::after{content:"";display:block;width:5px;height:5px;background:#2563eb;border-radius:50%;margin:2px auto 0;}
.legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:#6b7280;}
.legenda span{display:flex;align-items:center;gap:5px;}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.dia-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.dia-header h3{margin:0;font-size:16px;font-weight:700;}
.dia-badge{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin:16px 0 8px;}
.terapeuta-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3f4f6;}
.terapeuta-item:last-child{border-bottom:none;}
.t-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.t-avatar.fem{background:#fce7f3;color:#db2777;}
.t-avatar.masc{background:#dbeafe;color:#2563eb;}
.t-info{flex:1;}
.t-nome{font-size:13px;font-weight:600;color:#111827;}
.t-detalhe{font-size:11px;color:#6b7280;margin-top:1px;}
.terapeutas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;}
.t-card{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;background:#f9fafb;border:1px solid #f3f4f6;min-width:0;}
.t-card.indisp{background:#fef2f2;border-color:#fee2e2;}
.t-card .t-avatar{width:22px;height:22px;font-size:10px;flex-shrink:0;}
.t-card .t-info{flex:1;min-width:0;}
.t-card .t-nome{font-size:11px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-card .t-detalhe{font-size:9px;color:#6b7280;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-card .badge-motivo,.t-card .badge-horario{font-size:9px;padding:1px 5px;}
.badge-motivo{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;background:#fee2e2;color:#991b1b;}
.badge-horario{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;background:#eff6ff;color:#1d4ed8;}
.empty-state{text-align:center;color:#9ca3af;padding:40px 0;font-size:13px;}

/* gráfico */
.grafico-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.grafico-header h3{margin:0;font-size:14px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px;}
.grafico-wrap{position:relative;width:100%;}
#graficoCanvas{width:100%;display:block;border-radius:8px;}
.grafico-tooltip{position:fixed;background:#1f2937;color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:6px 12px;pointer-events:none;display:none;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.grafico-tooltip::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom:none;border-top-color:#1f2937;}
.grafico-legenda{display:flex;gap:16px;margin-top:12px;font-size:11px;color:#6b7280;flex-wrap:wrap;}
.grafico-legenda span{display:flex;align-items:center;gap:5px;}
.leg-g{width:10px;height:10px;border-radius:3px;}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar"></aside>
<main class="content">
  <div class="topbar">
    <h1>Escalas</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <select id="filtroCorCabelo" style="display:none;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;color:#374151;background:#fff;">
        <option value="">Todas as cores de cabelo</option>
      </select>
    </div>
  </div>

  <div class="layout">
    <div class="card">
      <div class="mes-nav">
        <button onclick="mudarMes(-1)"><i class="fa fa-chevron-left"></i></button>
        <h3 id="tituloMes"></h3>
        <button onclick="mudarMes(1)"><i class="fa fa-chevron-right"></i></button>
      </div>
      <div class="weekdays">
        <div>Dom</div><div>Seg</div><div>Ter</div>
        <div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
      </div>
      <div class="calendar" id="calendar"></div>
      <div class="legenda" id="legendaWrap">
        <span><span class="leg-dot" style="background:#22c55e"></span> Todos disponíveis</span>
        <span><span class="leg-dot" style="background:#eab308"></span> Alguns ausentes</span>
        <span><span class="leg-dot" style="background:#ef4444"></span> Muitos ausentes</span>
        <span><span class="leg-dot" style="background:#d1d5db"></span> Fechado</span>
      </div>
    </div>
    <div class="card">
      <div id="painelDia">
        <div class="empty-state">
          <i class="fa fa-calendar" style="font-size:32px;display:block;margin-bottom:12px;color:#d1d5db"></i>
          Selecione um dia no calendário
        </div>
      </div>
    </div>
  </div>

  <!-- GRÁFICO DE CONCENTRAÇÃO POR HORÁRIO -->
  <div class="card" id="cardGrafico" style="display:none;margin-top:20px;">
    <div class="grafico-header">
      <h3><i class="fa fa-chart-column" style="color:#2563eb"></i>Concentração por Horário</h3>
      <span id="graficoSubtitulo" style="font-size:12px;color:#9ca3af;font-weight:600"></span>
    </div>
    <div class="grafico-wrap">
      <canvas id="graficoCanvas" height="160"></canvas>
    </div>
    <div class="grafico-tooltip" id="graficoTooltip"></div>
    <div class="grafico-legenda">
      <span><span class="leg-g" style="background:linear-gradient(to top,#16a34a,#4ade80)"></span>Alta disponibilidade</span>
      <span><span class="leg-g" style="background:linear-gradient(to top,#d97706,#fbbf24)"></span>Média</span>
      <span><span class="leg-g" style="background:linear-gradient(to top,#dc2626,#f87171)"></span>Baixa / Vazio</span>
    </div>
  </div>
</main>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/tracker.js"></script>
<script src="assets/sidebar/sidebar.js"></script>
<script>
let terapeutas = [];
let solicitacoes = [];
let minhaTerapeuta = null;
let hoje = new Date();
let ano = hoje.getFullYear();
let mes = hoje.getMonth();
let diaSelecionado = null;
let filtroCorCabelo = "";

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function isoDate(d){ return d.toISOString().split("T")[0]; }
function diaSemana(date){ return ["domingo","segunda","terça","quarta","quinta","sexta","sábado"][date.getDay()]; }
function folgaSemanal(t,data){ return t.tem_folga==="Sim"&&diaSemana(data)===(t.dia_folga||"").toLowerCase(); }
function fmtHora(v){ if(!v)return""; return v.slice(0,5); }

function solicitacaoAusencia(t,data){
  const iso=isoDate(data);
  return solicitacoes.find(s=>
    s.terapeuta_cpf===t.cpf &&
    s.status==="Acordado" &&
    s.tipo!=="Alteração de Horário" &&
    iso>=s.data_inicio &&
    iso<=s.data_fim
  )||null;
}

function solicitacaoHorario(t,data){
  const iso=isoDate(data);
  return solicitacoes.find(s=>
    s.terapeuta_cpf===t.cpf &&
    s.status==="Acordado" &&
    s.tipo==="Alteração de Horário" &&
    iso>=s.data_inicio &&
    iso<=s.data_fim
  )||null;
}

function estaIndisponivel(t,data){
  return folgaSemanal(t,data)||!!solicitacaoAusencia(t,data);
}

function ehFeminina(t){ return t.cargo==="Terapeuta Feminina"; }
function eTerapeuta(u){ return u&&u.role==="usuario"; }
function terapeutasFiltradas(){
  if(!filtroCorCabelo) return terapeutas;
  return terapeutas.filter(t=>t.cor_cabelo===filtroCorCabelo);
}
function getUser(cb,tentativas=20){ if(window.usuarioLogado)return cb(window.usuarioLogado); if(tentativas<=0)return cb(null); setTimeout(()=>getUser(cb,tentativas-1),100); }

async function carregarDados(){
  return new Promise(resolve=>{
    getUser(async u=>{
      const selCor=document.getElementById("filtroCorCabelo");
      if(u&&(u.role==="admin"||u.role==="apoio")){
        selCor.style.display="inline-block";
      }

      const [{data:ter},{data:sol}]=await Promise.all([
        // funcionario (ex-terapeutas)
        client.from("funcionario").select("*").eq("status","Ativo").in("cargo",["Terapeuta Feminina","Terapeuta Masculino"]),
        // funcionario_solicitacao (ex-solicitacoes)
        client.from("funcionario_solicitacao").select("*").eq("status","Acordado")
      ]);
      terapeutas=ter||[]; solicitacoes=sol||[];

      if(u&&(u.role==="admin"||u.role==="apoio")){
        const cores=[...new Set(terapeutas.map(t=>t.cor_cabelo).filter(Boolean))].sort();
        selCor.innerHTML='<option value="">Todas as cores de cabelo</option>'+
          cores.map(c=>'<option value="'+c+'">'+c+'</option>').join("");
      }

      if(eTerapeuta(u)&&u.cpf){
        minhaTerapeuta=terapeutas.find(t=>t.cpf===u.cpf)||null;
        document.getElementById("legendaWrap").innerHTML=
          '<span><span class="leg-dot" style="background:#22c55e"></span> Disponível</span>'+
          '<span><span class="leg-dot" style="background:#3b82f6"></span> Horário alterado</span>'+
          '<span><span class="leg-dot" style="background:#ef4444"></span> Ausente</span>'+
          '<span><span class="leg-dot" style="background:#d1d5db"></span> Fechado</span>';
      }
      renderCalendar();
      resolve();
    });
  });
}

function mudarMes(delta){
  mes+=delta;
  if(mes<0){mes=11;ano--;}
  if(mes>11){mes=0;ano++;}
  renderCalendar();
}

function renderCalendar(){
  const u=window.usuarioLogado;
  document.getElementById("tituloMes").textContent=MESES[mes]+" "+ano;
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  const primeiroDia=new Date(ano,mes,1).getDay();
  const totalDias=new Date(ano,mes+1,0).getDate();

  for(let i=0;i<primeiroDia;i++) cal.appendChild(document.createElement("div"));

  for(let d=1;d<=totalDias;d++){
    const data=new Date(ano,mes,d);
    const div=document.createElement("div");
    const isHoje=isoDate(data)===isoDate(hoje);
    div.className="day"+(isHoje?" day-hoje":"");
    const domingo=data.getDay()===0;

    if(domingo){
      div.classList.add("day-fechado");
      div.innerHTML='<div class="day-number">'+d+'</div><small>Fechado</small>';
      cal.appendChild(div);
      continue;
    }

    if(diaSelecionado===d) div.classList.add("selected");

    if(eTerapeuta(u)&&minhaTerapeuta){
      const t=minhaTerapeuta;
      const ausente=estaIndisponivel(t,data);
      const solHor=!ausente?solicitacaoHorario(t,data):null;
      let label;
      if(ausente){ div.classList.add("day-vermelho"); label="Ausente"; }
      else if(solHor){ div.style.background="#eff6ff"; div.style.borderColor="#3b82f6"; label="Horário alterado"; }
      else{ div.classList.add("day-verde"); label="Disponível"; }
      div.innerHTML='<div class="day-number">'+d+'</div><small>'+label+'</small>';
    } else {
      const baseT=terapeutasFiltradas();
      const disponiveis=baseT.filter(t=>!estaIndisponivel(t,data));
      const ausentes=baseT.length-disponiveis.length;
      if(ausentes===0) div.classList.add("day-verde");
      else if(ausentes<4) div.classList.add("day-amarelo");
      else div.classList.add("day-vermelho");
      div.innerHTML='<div class="day-number">'+d+'</div><small>'+disponiveis.length+' disponíveis</small>';
    }

    div.onclick=(function(dd){return function(){mostrarDia(dd);};})(d);
    cal.appendChild(div);
  }
}

function mostrarDia(dia){
  diaSelecionado=dia;
  renderCalendar();
  const u=window.usuarioLogado;
  const data=new Date(ano,mes,dia);
  const painel=document.getElementById("painelDia");
  renderGrafico(data);
  const dataStr=String(dia).padStart(2,"0")+"/"+String(mes+1).padStart(2,"0")+"/"+ano;
  const domingo=data.getDay()===0;

  if(domingo){
    painel.innerHTML=
      '<div class="dia-header"><h3>'+dataStr+'</h3><span class="dia-badge" style="background:#f3f4f6;color:#6b7280">Fechado</span></div>'+
      '<div style="text-align:center;padding:32px;color:#9ca3af;font-size:13px"><i class="fa fa-store-slash" style="font-size:24px;display:block;margin-bottom:8px;color:#d1d5db"></i>Domingo — clínica fechada</div>';
    return;
  }

  // ---- VISÃO DA PRÓPRIA TERAPEUTA ----
  if(eTerapeuta(u)&&minhaTerapeuta){
    const t=minhaTerapeuta;
    const ausente=estaIndisponivel(t,data);
    const solAus=solicitacaoAusencia(t,data);
    const solHor=!ausente?solicitacaoHorario(t,data):null;
    const avatarClass=ehFeminina(t)?"fem":"masc";
    const iconClass=ehFeminina(t)?"fa-person-dress":"fa-person";
    let badgeHtml,detalheHtml;
    if(ausente){
      const motivo=folgaSemanal(t,data)?"Folga ("+t.dia_folga+")":(solAus?solAus.tipo:"Ausência acordada");
      badgeHtml='<span class="dia-badge" style="background:#fee2e2;color:#991b1b">Ausente</span>';
      detalheHtml='<span class="badge-motivo">'+motivo+'</span>';
    } else if(solHor){
      const hi=fmtHora(solHor.hora_inicio),hf=fmtHora(solHor.hora_fim);
      badgeHtml='<span class="dia-badge" style="background:#eff6ff;color:#1d4ed8">Horário alterado</span>';
      detalheHtml='<span class="badge-horario"><i class="fa fa-clock"></i> '+hi+' – '+hf+'</span>';
    } else {
      badgeHtml='<span class="dia-badge" style="background:#dcfce7;color:#16a34a">Disponível</span>';
      detalheHtml=(t.hora_entrada||"")+" – "+(t.hora_saida||"");
    }
    painel.innerHTML=
      '<div class="dia-header"><h3>'+dataStr+'</h3>'+badgeHtml+'</div>'+
      '<div class="terapeuta-item" style="border:none">'+
        '<div class="t-avatar '+avatarClass+'"><i class="fa '+iconClass+'"></i></div>'+
        '<div class="t-info">'+
          '<div class="t-nome">'+t.nome_profissional+'</div>'+
          '<div class="t-detalhe">'+detalheHtml+'</div>'+
        '</div>'+
      '</div>';
    return;
  }

  // ---- VISÃO ADMIN/APOIO ----
  const baseT=terapeutasFiltradas();
  const disponiveis=baseT.filter(t=>!estaIndisponivel(t,data)).sort((a,b)=>(a.nome_profissional||"").localeCompare(b.nome_profissional||"","pt-BR"));
  const indisponiveis=baseT.filter(t=>estaIndisponivel(t,data)).sort((a,b)=>(a.nome_profissional||"").localeCompare(b.nome_profissional||"","pt-BR"));
  const fem=disponiveis.filter(t=>ehFeminina(t)).length;
  const masc=disponiveis.filter(t=>!ehFeminina(t)).length;

  let html=
    '<div class="dia-header"><h3>'+dataStr+'</h3><span class="dia-badge" style="background:#dcfce7;color:#16a34a">'+disponiveis.length+' disponíveis</span></div>'+
    '<div style="display:flex;gap:8px;font-size:12px;color:#6b7280;margin-bottom:4px">'+
      '<span><i class="fa fa-person-dress" style="color:#db2777"></i> '+fem+' femininas</span>'+
      '<span><i class="fa fa-person" style="color:#2563eb"></i> '+masc+' masculinos</span>'+
    '</div>'+
    '<div class="section-label">Disponíveis ('+disponiveis.length+')</div>';

  if(disponiveis.length){
    html+='<div class="terapeutas-grid">';
    disponiveis.forEach(function(t){
      const solHor=solicitacaoHorario(t,data);
      let detalhe;
      if(solHor){
        const hi=fmtHora(solHor.hora_inicio),hf=fmtHora(solHor.hora_fim);
        detalhe='<span class="badge-horario"><i class="fa fa-clock"></i> '+hi+'–'+hf+'</span>';
      } else {
        detalhe=(t.hora_entrada||"")+" – "+(t.hora_saida||"");
      }
      html+='<div class="t-card">'+
        '<div class="t-avatar '+(ehFeminina(t)?"fem":"masc")+'"><i class="fa '+(ehFeminina(t)?"fa-person-dress":"fa-person")+'"></i></div>'+
        '<div class="t-info"><div class="t-nome" title="'+t.nome_profissional+'">'+t.nome_profissional+'</div><div class="t-detalhe">'+detalhe+'</div></div>'+
      '</div>';
    });
    html+='</div>';
  } else {
    html+='<div style="color:#9ca3af;font-size:13px">Nenhum disponível</div>';
  }

  if(indisponiveis.length){
    html+='<div class="section-label">Indisponíveis ('+indisponiveis.length+')</div>';
    html+='<div class="terapeutas-grid">';
    indisponiveis.forEach(function(t){
      const solAus=solicitacaoAusencia(t,data);
      const motivo=folgaSemanal(t,data)?"Folga ("+t.dia_folga+")":(solAus?solAus.tipo:"Ausência acordada");
      html+='<div class="t-card indisp">'+
        '<div class="t-avatar '+(ehFeminina(t)?"fem":"masc")+'"><i class="fa '+(ehFeminina(t)?"fa-person-dress":"fa-person")+'"></i></div>'+
        '<div class="t-info"><div class="t-nome" title="'+t.nome_profissional+'">'+t.nome_profissional+'</div><div class="t-detalhe"><span class="badge-motivo">'+motivo+'</span></div></div>'+
      '</div>';
    });
    html+='</div>';
  }

  painel.innerHTML=html;
}

function horaParaMinutos(h){
  if(!h)return null;
  const p=h.split(":");
  return parseInt(p[0])*60+parseInt(p[1]||0);
}

function renderGrafico(data){
  const card=document.getElementById("cardGrafico");
  const canvas=document.getElementById("graficoCanvas");
  const tooltip=document.getElementById("graficoTooltip");
  const subtitulo=document.getElementById("graficoSubtitulo");
  const u=window.usuarioLogado;
  if(eTerapeuta(u)||!data){card.style.display="none";return;}
  if(data.getDay()===0){card.style.display="none";return;}

  card.style.display="block";
  const ds=data.getDate().toString().padStart(2,"0")+"/"+(data.getMonth()+1).toString().padStart(2,"0")+"/"+data.getFullYear();
  subtitulo.textContent=ds;

  const INICIO=8*60, FIM=22*60, PASSO=60;
  const slots=[];
  for(let m=INICIO;m<FIM;m+=PASSO) slots.push(m);

  const baseGrafico=terapeutasFiltradas();
  const contagens=slots.map(slot=>
    baseGrafico.filter(t=>{
      if(estaIndisponivel(t,data)) return false;
      const s=solicitacaoHorario(t,data);
      const en=horaParaMinutos(s?s.hora_inicio:t.hora_entrada);
      const sa=horaParaMinutos(s?s.hora_fim:t.hora_saida);
      if(en===null||sa===null) return false;
      return slot>=en && slot<sa;
    }).length
  );

  const maxVal=Math.max(...contagens,1);
  const W=canvas.offsetWidth||canvas.parentElement.offsetWidth||900;
  const H=160;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);

  const PAD_LEFT=36, PAD_RIGHT=8, PAD_TOP=12, PAD_BOTTOM=32;
  const chartW=W-PAD_LEFT-PAD_RIGHT;
  const chartH=H-PAD_TOP-PAD_BOTTOM;
  const barW=chartW/slots.length;
  const GAP=Math.max(2, barW*0.18);
  const bW=barW-GAP;
  const RADIUS=Math.min(5, bW/2);

  ctx.strokeStyle="#f3f4f6"; ctx.lineWidth=1;
  [0.25,0.5,0.75,1].forEach(f=>{
    const y=PAD_TOP+chartH*(1-f);
    ctx.beginPath(); ctx.moveTo(PAD_LEFT,y); ctx.lineTo(W-PAD_RIGHT,y); ctx.stroke();
  });

  ctx.fillStyle="#d1d5db"; ctx.font="600 10px 'Segoe UI',sans-serif"; ctx.textAlign="right";
  [0,Math.round(maxVal/2),maxVal].forEach((v,i)=>{
    const f=[0,0.5,1][i];
    const y=PAD_TOP+chartH*(1-f)+3;
    ctx.fillText(v, PAD_LEFT-6, y);
  });

  contagens.forEach((count,i)=>{
    const pct=count/maxVal;
    const x=PAD_LEFT+i*barW+GAP/2;
    const barH=Math.max(pct*chartH, count>0?6:2);
    const y=PAD_TOP+chartH-barH;
    const grad=ctx.createLinearGradient(0,y,0,y+barH);
    if(count===0){
      grad.addColorStop(0,"#e5e7eb"); grad.addColorStop(1,"#f3f4f6");
    } else if(pct>=0.65){
      grad.addColorStop(0,"#4ade80"); grad.addColorStop(1,"#16a34a");
    } else if(pct>=0.35){
      grad.addColorStop(0,"#fbbf24"); grad.addColorStop(1,"#d97706");
    } else {
      grad.addColorStop(0,"#f87171"); grad.addColorStop(1,"#dc2626");
    }
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(x+RADIUS, y);
    ctx.lineTo(x+bW-RADIUS, y);
    ctx.quadraticCurveTo(x+bW, y, x+bW, y+RADIUS);
    ctx.lineTo(x+bW, y+barH);
    ctx.lineTo(x, y+barH);
    ctx.lineTo(x, y+RADIUS);
    ctx.quadraticCurveTo(x, y, x+RADIUS, y);
    ctx.closePath();
    ctx.fill();
    if(slots[i]%60===0){
      const h=Math.floor(slots[i]/60).toString().padStart(2,"0")+"h";
      ctx.fillStyle="#9ca3af"; ctx.font="600 10px 'Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText(h, x+bW/2, H-8);
    }
  });

  ctx.strokeStyle="#e5e7eb"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(PAD_LEFT,PAD_TOP+chartH); ctx.lineTo(W-PAD_RIGHT,PAD_TOP+chartH); ctx.stroke();

  canvas._slots=slots; canvas._contagens=contagens;
  canvas._meta={PAD_LEFT,PAD_RIGHT,PAD_TOP,PAD_BOTTOM,chartW,chartH,barW,bW,GAP,W,H};
  canvas.style.cursor="pointer";

  canvas.onmousemove=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const meta=canvas._meta;
    const i=Math.floor((mx-meta.PAD_LEFT)/meta.barW);
    if(i>=0&&i<canvas._slots.length){
      const slot=canvas._slots[i];
      const count=canvas._contagens[i];
      const hh=Math.floor(slot/60).toString().padStart(2,"0");
      const mm=(slot%60).toString().padStart(2,"0");
      const hh2=Math.floor((slot+60)/60).toString().padStart(2,"0");
      const mm2=((slot+60)%60).toString().padStart(2,"0");
      tooltip.textContent=hh+":"+mm+"–"+hh2+":"+mm2+"  •  "+count+" terapeuta"+(count!==1?"s":"")+" — clique para filtrar";
      tooltip.style.display="block";
      tooltip.style.left=(e.clientX-tooltip.offsetWidth/2)+"px";
      tooltip.style.top=(e.clientY-44)+"px";
    } else {
      tooltip.style.display="none";
    }
  };
  canvas.onmouseleave=function(){ tooltip.style.display="none"; };

  canvas.onclick=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const meta=canvas._meta;
    const i=Math.floor((mx-meta.PAD_LEFT)/meta.barW);
    if(i<0||i>=canvas._slots.length) return;
    const slot=canvas._slots[i];
    const dataAtual=new Date(ano,mes,diaSelecionado);
    const baseT=terapeutasFiltradas();
    const noSlot=baseT.filter(t=>{
      if(estaIndisponivel(t,dataAtual)) return false;
      const s=solicitacaoHorario(t,dataAtual);
      const en=horaParaMinutos(s?s.hora_inicio:t.hora_entrada);
      const sa=horaParaMinutos(s?s.hora_fim:t.hora_saida);
      if(en===null||sa===null) return false;
      return slot>=en && slot<sa;
    }).sort((a,b)=>(a.nome_profissional||"").localeCompare(b.nome_profissional||"","pt-BR"));
    const foraSlot=baseT.filter(t=>{
      if(estaIndisponivel(t,dataAtual)) return true;
      const s=solicitacaoHorario(t,dataAtual);
      const en=horaParaMinutos(s?s.hora_inicio:t.hora_entrada);
      const sa=horaParaMinutos(s?s.hora_fim:t.hora_saida);
      if(en===null||sa===null) return true;
      return !(slot>=en && slot<sa);
    }).sort((a,b)=>(a.nome_profissional||"").localeCompare(b.nome_profissional||"","pt-BR"));
    const hh=Math.floor(slot/60).toString().padStart(2,"0");
    const mm=(slot%60).toString().padStart(2,"0");
    const hh2=Math.floor((slot+60)/60).toString().padStart(2,"0");
    const mm2=((slot+60)%60).toString().padStart(2,"0");
    const horaStr=hh+":"+mm+"–"+hh2+":"+mm2;
    const painel=document.getElementById("painelDia");
    const dataStr=String(diaSelecionado).padStart(2,"0")+"/"+String(mes+1).padStart(2,"0")+"/"+ano;
    let html=
      '<div class="dia-header"><h3>'+dataStr+'</h3>'+
      '<span class="dia-badge" style="background:#eff6ff;color:#1d4ed8;display:flex;align-items:center;gap:5px">'+
      '<i class="fa fa-clock"></i> '+horaStr+'</span>'+
      '<button onclick="mostrarDia('+diaSelecionado+')" style="background:#f3f4f6;color:#374151;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;margin-left:8px">✕ Limpar filtro</button></div>';
    html+='<div style="font-size:12px;color:#6b7280;margin-bottom:8px">'+noSlot.length+' disponível(is) neste horário</div>';
    html+='<div class="section-label">Disponíveis às '+horaStr+' ('+noSlot.length+')</div>';
    if(noSlot.length){
      html+='<div class="terapeutas-grid">';
      noSlot.forEach(function(t){
        const s=solicitacaoHorario(t,dataAtual);
        const detalhe=s?'<span class="badge-horario"><i class="fa fa-clock"></i> '+fmtHora(s.hora_inicio)+'–'+fmtHora(s.hora_fim)+'</span>':(t.hora_entrada||"")+' – '+(t.hora_saida||"");
        html+='<div class="t-card"><div class="t-avatar '+(ehFeminina(t)?"fem":"masc")+'"><i class="fa '+(ehFeminina(t)?"fa-person-dress":"fa-person")+'"></i></div>'+
          '<div class="t-info"><div class="t-nome" title="'+t.nome_profissional+'">'+t.nome_profissional+'</div><div class="t-detalhe">'+detalhe+'</div></div></div>';
      });
      html+='</div>';
    }
    if(foraSlot.length){
      html+='<div class="section-label">Fora deste horário ('+foraSlot.length+')</div>';
      html+='<div class="terapeutas-grid">';
      foraSlot.forEach(function(t){
        const ausente=estaIndisponivel(t,dataAtual);
        const s=!ausente?solicitacaoHorario(t,dataAtual):null;
        const detalhe=ausente?'<span class="badge-motivo">Ausente</span>':s?'<span class="badge-horario">'+fmtHora(s.hora_inicio)+'–'+fmtHora(s.hora_fim)+'</span>':(t.hora_entrada||"")+' – '+(t.hora_saida||"");
        html+='<div class="t-card indisp"><div class="t-avatar '+(ehFeminina(t)?"fem":"masc")+'"><i class="fa '+(ehFeminina(t)?"fa-person-dress":"fa-person")+'"></i></div>'+
          '<div class="t-info"><div class="t-nome" title="'+t.nome_profissional+'">'+t.nome_profissional+'</div><div class="t-detalhe">'+detalhe+'</div></div></div>';
      });
      html+='</div>';
    }
    painel.innerHTML=html;
    tooltip.style.display="none";
  };
}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById("filtroCorCabelo").addEventListener("change",function(){
    filtroCorCabelo=this.value;
    renderCalendar();
    if(diaSelecionado) mostrarDia(diaSelecionado);
  });
  function tentarSelecionarHoje(tentativas){
    if(tentativas<=0) return;
    if(!window.usuarioLogado){ setTimeout(()=>tentarSelecionarHoje(tentativas-1),150); return; }
    if(terapeutas.length===0){ setTimeout(()=>tentarSelecionarHoje(tentativas-1),150); return; }
    const d=hoje.getDay();
    if(ano===hoje.getFullYear()&&mes===hoje.getMonth()&&d!==0){
      mostrarDia(hoje.getDate());
    }
  }
  carregarDados();
  setTimeout(()=>tentarSelecionarHoje(20),300);
});
</script>
