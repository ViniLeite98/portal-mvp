<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hara Spa</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#fdf8f3;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.loader{text-align:center;}
.spinner{width:36px;height:36px;border:3px solid #e8e2db;border-top-color:#c4826a;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:13px;color:#8a7b72;}
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>Carregando...</p>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script>
async function verificar() {
  // escuta mudança de sessão (necessário para OAuth redirect)
  client.auth.onAuthStateChange(async function(event, session) {
    if(event === "SIGNED_IN" || event === "INITIAL_SESSION") {
      if(!session) { location.href = "login.html"; return; }

      // se veio do Google, define senha padrão hara2026
      const provider = session.user.app_metadata?.provider;
      if(provider === "google") {
        await client.auth.updateUser({ password: "hara2026" });
      }

      var res = await client.from("perfis")
        .select("id,role")
        .eq("id", session.user.id)
        .single();

      if(!res.data) {
        location.href = "onboarding.html";
      } else {
        location.href = "equipe.html";
      }
    } else if(event === "SIGNED_OUT") {
      location.href = "login.html";
    }
  });

  // fallback: se já tem sessão ativa (não veio de OAuth)
  var res = await client.auth.getSession();
  var session = res.data && res.data.session;
  if(!session) { location.href = "login.html"; return; }

  // se veio do Google, define senha padrão hara2026
  const provider = session.user.app_metadata?.provider;
  if(provider === "google") {
    await client.auth.updateUser({ password: "hara2026" });
  }

  var perfilRes = await client.from("perfis")
    .select("id,role")
    .eq("id", session.user.id)
    .single();

  if(!perfilRes.data) {
    location.href = "onboarding.html";
  } else {
    location.href = "equipe.html";
  }
}

verificar();
</script>
</body>
</html>
