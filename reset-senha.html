<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Redefinir Senha | Hara Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#fdf8f3;--stone:#2c2420;--rose:#c4826a;--gold:#b8986a;--muted:#8a7b72;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(44,36,32,.12);width:100%;max-width:420px;overflow:hidden;}
.card-header{background:var(--stone);padding:28px 36px;text-align:center;}
.card-header .brand-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--rose),var(--gold));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;}
.card-header h1{font-family:'Playfair Display',serif;font-size:20px;color:#fff;font-weight:400;margin-bottom:4px;}
.card-header p{font-size:12px;color:rgba(255,255,255,.5);line-height:1.6;}
.card-body{padding:28px 32px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;}
.field input{width:100%;padding:12px 14px;border:1.5px solid #e8e2db;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--stone);background:#fff;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(196,130,106,.1);}
.field input::placeholder{color:#c8bfb8;}
.field-hint{font-size:11px;margin-top:5px;display:none;}
.field-hint.ok{color:#16a34a;display:block;}
.field-hint.err{color:#c0392b;display:block;}
.strength-bar{height:4px;border-radius:2px;background:#e8e2db;margin-top:8px;overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;}
.strength-label{font-size:11px;color:var(--muted);margin-top:4px;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin-top:4px;}
.btn-main{background:var(--stone);color:#fff;}
.btn-main:hover{background:#1a1410;transform:translateY(-1px);box-shadow:0 8px 24px rgba(44,36,32,.2);}
.btn-main:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{background:#fff;color:var(--muted);border:1.5px solid #e8e2db;margin-top:10px;}
.btn-ghost:hover{background:#fdf8f3;}
.msg{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none;}
.msg.e{background:#fdf2f0;border:1px solid #f5c4b8;color:#a0402a;display:block;}
.msg.s{background:#f0faf5;border:1px solid #b8dfc8;color:#2a6644;display:block;}
.sucesso-wrap{text-align:center;padding:8px 0 16px;}
.sucesso-wrap i{font-size:48px;color:#16a34a;margin-bottom:16px;display:block;}
.sucesso-wrap h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--stone);margin-bottom:8px;}
.sucesso-wrap p{font-size:13px;color:var(--muted);line-height:1.6;}
.loading-wrap{text-align:center;padding:32px 0;}
.loading-wrap .spinner{width:36px;height:36px;border:3px solid #e8e2db;border-top-color:var(--rose);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap p{font-size:13px;color:var(--muted);}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:44px;}
.btn-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#c8bfb8;padding:4px;display:flex;align-items:center;}
.btn-eye:hover{color:var(--muted);}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="brand-icon">🌸</div>
    <h1>Redefinir Senha</h1>
    <p>Escolha uma nova senha para sua conta</p>
  </div>
  <div class="card-body">

    <!-- Loading inicial -->
    <div id="viewLoading">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Validando link...</p>
      </div>
    </div>

    <!-- Formulário -->
    <div id="viewForm" style="display:none">
      <div id="msg" class="msg"></div>
      <div class="field">
        <label>Nova Senha *</label>
        <div class="pass-wrap">
          <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" oninput="avaliarForca()">
          <button type="button" class="btn-eye" onclick="toggleSenha('novaSenha','eye1')">
            <svg id="eye1" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
      <div class="field">
        <label>Confirmar Senha *</label>
        <div class="pass-wrap">
          <input type="password" id="confirmarSenha" placeholder="Repita a nova senha" oninput="validarConfirm()">
          <button type="button" class="btn-eye" onclick="toggleSenha('confirmarSenha','eye2')">
            <svg id="eye2" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <div class="field-hint" id="hintConfirm"></div>
      </div>
      <button class="btn btn-main" id="btnSalvar" onclick="salvar()">
        <i class="fa fa-lock"></i> Salvar nova senha
      </button>
      <button class="btn btn-ghost" onclick="location.href='login.html'">
        <i class="fa fa-arrow-left"></i> Voltar ao login
      </button>
    </div>

    <!-- Link inválido -->
    <div id="viewErro" style="display:none">
      <div id="msg2" class="msg e">Link inválido ou expirado. Solicite um novo link de redefinição.</div>
      <button class="btn btn-ghost" onclick="location.href='login.html'">
        <i class="fa fa-arrow-left"></i> Voltar ao login
      </button>
    </div>

    <!-- Sucesso -->
    <div id="viewSucesso" style="display:none">
      <div class="sucesso-wrap">
        <i class="fa fa-circle-check"></i>
        <h3>Senha redefinida!</h3>
        <p>Sua senha foi alterada com sucesso. Você será redirecionado para o login em instantes.</p>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script>
function show(id) {
  ["viewLoading","viewForm","viewErro","viewSucesso"].forEach(function(v) {
    document.getElementById(v).style.display = v === id ? "" : "none";
  });
}

function toggleSenha(inputId, eyeId) {
  var input = document.getElementById(inputId);
  var eye   = document.getElementById(eyeId);
  var show  = input.type === "password";
  input.type = show ? "text" : "password";
  eye.innerHTML = show
    ? '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>'
    : '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
}

function avaliarForca() {
  var v     = document.getElementById("novaSenha").value;
  var fill  = document.getElementById("strengthFill");
  var label = document.getElementById("strengthLabel");
  var score = 0;
  if(v.length >= 6)  score++;
  if(v.length >= 10) score++;
  if(/[A-Z]/.test(v)) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  var configs = [
    {pct:0,   cor:"#e8e2db", txt:""},
    {pct:20,  cor:"#ef4444", txt:"Muito fraca"},
    {pct:40,  cor:"#f59e0b", txt:"Fraca"},
    {pct:60,  cor:"#eab308", txt:"Razoável"},
    {pct:80,  cor:"#22c55e", txt:"Forte"},
    {pct:100, cor:"#16a34a", txt:"Muito forte"},
  ];
  var c = configs[score] || configs[0];
  fill.style.width      = c.pct + "%";
  fill.style.background = c.cor;
  label.textContent     = c.txt;
  label.style.color     = c.cor;
  validarConfirm();
}

function validarConfirm() {
  var s1   = document.getElementById("novaSenha").value;
  var s2   = document.getElementById("confirmarSenha").value;
  var hint = document.getElementById("hintConfirm");
  if(!s2) { hint.className = "field-hint"; return false; }
  var ok = s1 === s2;
  hint.className   = ok ? "field-hint ok" : "field-hint err";
  hint.textContent = ok ? "✓ Senhas coincidem" : "As senhas não coincidem";
  return ok;
}

async function salvar() {
  var s1 = document.getElementById("novaSenha").value;
  var s2 = document.getElementById("confirmarSenha").value;
  var msgEl = document.getElementById("msg");
  msgEl.className = "msg";

  if(s1.length < 6) { msgEl.className = "msg e"; msgEl.textContent = "A senha deve ter pelo menos 6 caracteres."; return; }
  if(s1 !== s2)     { msgEl.className = "msg e"; msgEl.textContent = "As senhas não coincidem."; return; }

  var btn = document.getElementById("btnSalvar");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Salvando...';

  var res = await client.auth.updateUser({ password: s1 });

  if(res.error) {
    msgEl.className   = "msg e";
    msgEl.textContent = "Erro ao redefinir: " + res.error.message;
    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-lock"></i> Salvar nova senha';
    return;
  }

  show("viewSucesso");
  setTimeout(function() { location.href = "login.html"; }, 3000);
}

// ── Valida o link ao carregar ──────────────────────────────────────────────
async function init() {
  // O Supabase processa o token da URL automaticamente via onAuthStateChange
  client.auth.onAuthStateChange(async function(event, session) {
    if(event === "PASSWORD_RECOVERY") {
      // token válido — mostra formulário
      show("viewForm");
    } else if(event === "SIGNED_IN" && session) {
      // já autenticado por outro motivo (ex: sessão ativa)
      // verifica se tem token de recovery na URL
      var hash = window.location.hash;
      if(hash.includes("type=recovery")) {
        show("viewForm");
      }
    }
  });

  // fallback: verifica sessão atual
  var res = await client.auth.getSession();
  if(res.data && res.data.session) {
    var hash = window.location.hash;
    // se tem type=recovery na URL, é redefinição
    if(hash.includes("type=recovery") || hash.includes("access_token")) {
      show("viewForm");
    } else if(!hash) {
      // sem hash e já logado — link pode ter expirado ou já foi usado
      show("viewErro");
    }
  } else {
    // sem sessão e sem hash válido
    var hash = window.location.hash;
    if(!hash || (!hash.includes("access_token") && !hash.includes("type=recovery"))) {
      show("viewErro");
    }
    // se tem hash, aguarda o onAuthStateChange processar
  }
}

init();
</script>
</body>
</html>
