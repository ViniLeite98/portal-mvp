<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Logins | Hara Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="assets/sidebar/sidebar.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#fdf8f3;--stone:#2c2420;--rose:#c4826a;--rose-light:#f0d5c8;
  --gold:#b8986a;--muted:#8a7b72;--sidebar-w:240px;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--stone);min-height:100vh;display:flex;}
.main{flex:1;margin-left:var(--sidebar-w);padding:32px;max-width:1400px;}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin-bottom:4px;}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:28px;}

/* Cards de resumo */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.card{background:#fff;border-radius:14px;padding:20px 22px;border:1px solid #ede8e3;}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;font-weight:600;}
.card-val{font-family:'Playfair Display',serif;font-size:28px;color:var(--stone);}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:12px;}
.card-icon.green{background:#dcfce7;color:#16a34a;}
.card-icon.red{background:#fee2e2;color:#dc2626;}
.card-icon.blue{background:#dbeafe;color:#2563eb;}
.card-icon.gold{background:#fef3c7;color:#d97706;}

/* Filtros */
.filtros{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filtro-group{display:flex;flex-direction:column;gap:4px;}
.filtro-group label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.filtro-group select,
.filtro-group input{padding:8px 12px;border:1.5px solid #e8e2db;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--stone);background:#fff;outline:none;cursor:pointer;}
.filtro-group select:focus,
.filtro-group input:focus{border-color:var(--rose);}
.btn-filtro{padding:8px 18px;background:var(--stone);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-end;}
.btn-filtro:hover{background:#1a1410;}
.btn-limpar{padding:8px 14px;background:transparent;color:var(--muted);border:1.5px solid #e8e2db;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;align-self:flex-end;}
.btn-limpar:hover{border-color:var(--rose);color:var(--rose);}

/* Tabela */
.tabela-wrap{background:#fff;border-radius:14px;border:1px solid #ede8e3;overflow:hidden;}
.tabela-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #ede8e3;}
.tabela-header span{font-size:13px;color:var(--muted);}
.tabela-header strong{font-size:14px;font-weight:600;}
table{width:100%;border-collapse:collapse;}
thead tr{background:#faf7f4;}
thead th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid #ede8e3;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f3ede7;transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#fdf8f3;}
td{padding:13px 16px;font-size:13px;vertical-align:middle;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.badge.sucesso{background:#dcfce7;color:#16a34a;}
.badge.falha{background:#fee2e2;color:#dc2626;}
.device-icon{font-size:14px;color:var(--muted);}
.empty{text-align:center;padding:56px;color:var(--muted);}
.empty i{font-size:36px;opacity:.3;display:block;margin-bottom:12px;}

/* Paginação */
.paginacao{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-top:1px solid #ede8e3;}
.paginacao span{font-size:13px;color:var(--muted);}
.pag-btns{display:flex;gap:6px;}
.pag-btn{padding:6px 12px;border:1.5px solid #e8e2db;border-radius:7px;background:#fff;font-size:13px;cursor:pointer;color:var(--stone);font-family:'DM Sans',sans-serif;}
.pag-btn:hover:not(:disabled){border-color:var(--rose);color:var(--rose);}
.pag-btn:disabled{opacity:.4;cursor:not-allowed;}
.pag-btn.active{background:var(--stone);color:#fff;border-color:var(--stone);}

/* Loading */
.loading{text-align:center;padding:48px;color:var(--muted);font-size:13px;}
.loading i{display:block;font-size:24px;margin-bottom:10px;opacity:.4;}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:768px){
  .main{margin-left:0;padding:20px;}
  .cards{grid-template-columns:1fr 1fr;}
  .filtros{flex-direction:column;align-items:stretch;}
  .btn-filtro,.btn-limpar{width:100%;}
  td:nth-child(5),th:nth-child(5){display:none;}
}
</style>
</head>
<body>
<div class="main">
  <h1>Histórico de Logins</h1>
  <p class="subtitle">Monitoramento de acessos ao portal</p>

  <!-- Cards resumo -->
  <div class="cards">
    <div class="card">
      <div class="card-icon green"><i class="fa fa-check"></i></div>
      <div class="card-label">Acessos hoje</div>
      <div class="card-val" id="cHoje">—</div>
      <div class="card-sub">logins com sucesso</div>
    </div>
    <div class="card">
      <div class="card-icon red"><i class="fa fa-xmark"></i></div>
      <div class="card-label">Falhas hoje</div>
      <div class="card-val" id="cFalhas">—</div>
      <div class="card-sub">tentativas inválidas</div>
    </div>
    <div class="card">
      <div class="card-icon blue"><i class="fa fa-users"></i></div>
      <div class="card-label">Usuários únicos</div>
      <div class="card-val" id="cUnicos">—</div>
      <div class="card-sub">nos últimos 7 dias</div>
    </div>
    <div class="card">
      <div class="card-icon gold"><i class="fa fa-clock"></i></div>
      <div class="card-label">Último acesso</div>
      <div class="card-val" id="cUltimo" style="font-size:14px;padding-top:4px;">—</div>
      <div class="card-sub" id="cUltimoSub"></div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <div class="filtro-group">
      <label>Status</label>
      <select id="fStatus">
        <option value="">Todos</option>
        <option value="sucesso">Sucesso</option>
        <option value="falha">Falha</option>
      </select>
    </div>
    <div class="filtro-group">
      <label>Usuário</label>
      <input type="text" id="fUsuario" placeholder="Nome ou email...">
    </div>
    <div class="filtro-group">
      <label>Data início</label>
      <input type="date" id="fDataIni">
    </div>
    <div class="filtro-group">
      <label>Data fim</label>
      <input type="date" id="fDataFim">
    </div>
    <button class="btn-filtro" onclick="aplicarFiltro()"><i class="fa fa-filter" style="margin-right:6px"></i>Filtrar</button>
    <button class="btn-limpar" onclick="limparFiltro()">Limpar</button>
  </div>

  <!-- Tabela -->
  <div class="tabela-wrap">
    <div class="tabela-header">
      <strong>Registros</strong>
      <span id="totalLabel">carregando...</span>
    </div>
    <div id="tabelaConteudo">
      <div class="loading"><i class="fa fa-spinner fa-spin"></i>Carregando registros...</div>
    </div>
    <div class="paginacao">
      <span id="paginfoLabel"></span>
      <div class="pag-btns">
        <button class="pag-btn" id="btnAnterior" onclick="pagAnterior()" disabled><i class="fa fa-chevron-left"></i></button>
        <div id="paginasBtns" style="display:flex;gap:6px;"></div>
        <button class="pag-btn" id="btnProximo" onclick="pagProximo()"><i class="fa fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
const POR_PAGINA = 25;
let paginaAtual = 1;
let totalRegistros = 0;
let filtros = {};

function fmtData(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function fmtHora(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function tempoAtras(iso) {
  if (!iso) return '';
  var diff = Date.now() - new Date(iso).getTime();
  var min = Math.floor(diff / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return min + 'min atrás';
  var h = Math.floor(min / 60);
  if (h < 24) return h + 'h atrás';
  return Math.floor(h / 24) + 'd atrás';
}

async function carregarCards() {
  var hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  var hojeISO = hoje.toISOString();

  var [resHoje, resFalhas, resUnicos, resUltimo] = await Promise.all([
    client.from('login_logs').select('id', {count:'exact', head:true})
      .eq('status','sucesso').gte('created_at', hojeISO),
    client.from('login_logs').select('id', {count:'exact', head:true})
      .eq('status','falha').gte('created_at', hojeISO),
    client.from('login_logs').select('email')
      .eq('status','sucesso')
      .gte('created_at', new Date(Date.now() - 7*24*60*60*1000).toISOString()),
    client.from('login_logs').select('nome,email,created_at')
      .eq('status','sucesso').order('created_at',{ascending:false}).limit(1)
  ]);

  document.getElementById('cHoje').textContent = resHoje.count ?? '0';
  document.getElementById('cFalhas').textContent = resFalhas.count ?? '0';

  var emails = new Set((resUnicos.data || []).map(r => r.email));
  document.getElementById('cUnicos').textContent = emails.size;

  if (resUltimo.data && resUltimo.data.length > 0) {
    var u = resUltimo.data[0];
    document.getElementById('cUltimo').textContent = u.nome || u.email || '—';
    document.getElementById('cUltimoSub').textContent = tempoAtras(u.created_at);
  }
}

async function carregarTabela() {
  document.getElementById('tabelaConteudo').innerHTML = '<div class="loading"><i class="fa fa-spinner fa-spin"></i>Carregando...</div>';

  var offset = (paginaAtual - 1) * POR_PAGINA;
  var q = client.from('login_logs').select('*', {count:'exact'})
    .order('created_at', {ascending: false})
    .range(offset, offset + POR_PAGINA - 1);

  if (filtros.status) q = q.eq('status', filtros.status);
  if (filtros.dataIni) q = q.gte('created_at', filtros.dataIni + 'T00:00:00');
  if (filtros.dataFim) q = q.lte('created_at', filtros.dataFim + 'T23:59:59');
  if (filtros.usuario) {
    q = q.or('nome.ilike.%' + filtros.usuario + '%,email.ilike.%' + filtros.usuario + '%');
  }

  var res = await q;
  totalRegistros = res.count || 0;
  var rows = res.data || [];

  document.getElementById('totalLabel').textContent = totalRegistros + ' registro' + (totalRegistros !== 1 ? 's' : '');

  var inicio = offset + 1;
  var fim = Math.min(offset + POR_PAGINA, totalRegistros);
  document.getElementById('paginfoLabel').textContent = totalRegistros > 0
    ? 'Mostrando ' + inicio + '–' + fim + ' de ' + totalRegistros
    : '';

  if (rows.length === 0) {
    document.getElementById('tabelaConteudo').innerHTML = '<div class="empty"><i class="fa fa-clock-rotate-left"></i>Nenhum registro encontrado.</div>';
    atualizarPaginacao();
    return;
  }

  var html = '<table><thead><tr>'
    + '<th>Data / Hora</th>'
    + '<th>Usuário</th>'
    + '<th>Status</th>'
    + '<th>Dispositivo</th>'
    + '<th>Navegador</th>'
    + '<th>Detalhe</th>'
    + '</tr></thead><tbody>';

  rows.forEach(function(r) {
    var statusBadge = r.status === 'sucesso'
      ? '<span class="badge sucesso"><i class="fa fa-check"></i>Sucesso</span>'
      : '<span class="badge falha"><i class="fa fa-xmark"></i>Falha</span>';

    var devIcon = r.dispositivo === 'mobile'
      ? '<i class="fa fa-mobile-screen device-icon" title="Mobile"></i>'
      : '<i class="fa fa-desktop device-icon" title="Desktop"></i>';

    html += '<tr>'
      + '<td style="white-space:nowrap">' + fmtData(r.created_at) + '</td>'
      + '<td>'
        + '<div style="font-weight:500">' + (r.nome || '—') + '</div>'
        + '<div style="font-size:11px;color:var(--muted)">' + (r.email || '') + '</div>'
      + '</td>'
      + '<td>' + statusBadge + '</td>'
      + '<td style="text-align:center">' + devIcon + '</td>'
      + '<td style="color:var(--muted)">' + (r.navegador || '—') + '</td>'
      + '<td style="color:var(--muted);font-size:12px">' + (r.motivo_falha ? traduzirErro(r.motivo_falha) : '—') + '</td>'
      + '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('tabelaConteudo').innerHTML = html;
  atualizarPaginacao();
}

function traduzirErro(m) {
  if (!m) return '—';
  if (m.indexOf('Invalid login') >= 0) return 'Senha incorreta';
  if (m.indexOf('Email not confirmed') >= 0) return 'Email não confirmado';
  if (m.indexOf('User not found') >= 0) return 'Usuário não encontrado';
  return m.substring(0, 40);
}

function atualizarPaginacao() {
  var totalPags = Math.ceil(totalRegistros / POR_PAGINA);
  document.getElementById('btnAnterior').disabled = paginaAtual <= 1;
  document.getElementById('btnProximo').disabled = paginaAtual >= totalPags;

  var container = document.getElementById('paginasBtns');
  container.innerHTML = '';

  var inicio = Math.max(1, paginaAtual - 2);
  var fim = Math.min(totalPags, paginaAtual + 2);

  for (var i = inicio; i <= fim; i++) {
    var btn = document.createElement('button');
    btn.className = 'pag-btn' + (i === paginaAtual ? ' active' : '');
    btn.textContent = i;
    btn.dataset.pag = i;
    btn.onclick = (function(p) { return function() { paginaAtual = p; carregarTabela(); }; })(i);
    container.appendChild(btn);
  }
}

function pagAnterior() { if (paginaAtual > 1) { paginaAtual--; carregarTabela(); } }
function pagProximo() {
  if (paginaAtual < Math.ceil(totalRegistros / POR_PAGINA)) { paginaAtual++; carregarTabela(); }
}

function aplicarFiltro() {
  filtros = {
    status: document.getElementById('fStatus').value,
    usuario: document.getElementById('fUsuario').value.trim(),
    dataIni: document.getElementById('fDataIni').value,
    dataFim: document.getElementById('fDataFim').value
  };
  paginaAtual = 1;
  carregarTabela();
}

function limparFiltro() {
  document.getElementById('fStatus').value = '';
  document.getElementById('fUsuario').value = '';
  document.getElementById('fDataIni').value = '';
  document.getElementById('fDataFim').value = '';
  filtros = {};
  paginaAtual = 1;
  carregarTabela();
}

// Filtrar ao pressionar Enter no campo usuário
document.getElementById('fUsuario').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') aplicarFiltro();
});

// Init
carregarCards();
carregarTabela();
</script>
</body>
</html>
